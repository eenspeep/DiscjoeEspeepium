<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grain"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="wordmark">Skill&nbsp;Builder</h1>
      <p class="tagline">Assemble the voices in your head.</p>
      <div class="topbar-actions">
        <button id="exportBtn" class="btn">Export build</button>
        <button id="importBtn" class="btn">Import build</button>
        <button id="resetBtn" class="btn">Reset</button>
        <input type="file" id="importFile" accept="application/json" hidden />
      </div>
    </div>
  </header>

  <main class="board" id="board" aria-live="polite"></main>

  <p class="hint">
    Raise an attribute to add pips to every skill in its row. Assign skill points
    to a single card with its &minus;&nbsp;/&nbsp;+. Hover a card for its description.
    Names, portraits, and descriptions are set in <code>data.js</code>.
  </p>

  <!-- shared hover tooltip, positioned by script -->
  <div id="tooltip" class="tooltip" role="status" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
