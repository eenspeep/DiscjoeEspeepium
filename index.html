<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grain"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="wordmark">Skill&nbsp;Builder</h1>
      <div class="topbar-actions">
        <button id="exportImgBtn" class="btn">Export image</button>
        <button id="resetBtn" class="btn">Reset</button>
      </div>
    </div>
  </header>

  <div class="budgets" id="budgets" aria-live="polite"></div>

  <main class="board" id="board" aria-live="polite"></main>

  <!-- shared hover tooltip, positioned by script -->
  <div id="tooltip" class="tooltip" role="status" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
