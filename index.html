<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grain"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="wordmark">Skill&nbsp;Builder</h1>
      <p class="tagline">Assemble the voices in your head.</p>
      <div class="topbar-actions">
        <button id="newSkillBtn" class="btn btn-primary">+ New Skill</button>
        <button id="exportBtn" class="btn">Export</button>
        <button id="importBtn" class="btn">Import</button>
        <input type="file" id="importFile" accept="application/json" hidden />
      </div>
    </div>
  </header>

  <nav class="filters" id="filters">
    <button class="chip chip-active" data-attr="all">All</button>
    <button class="chip" data-attr="intellect">Intellect</button>
    <button class="chip" data-attr="psyche">Psyche</button>
    <button class="chip" data-attr="physique">Physique</button>
    <button class="chip" data-attr="motorics">Motorics</button>
  </nav>

  <main class="board">
    <section id="grid" class="grid" aria-live="polite"></section>
    <div id="emptyState" class="empty" hidden>
      <p class="empty-title">No skills yet.</p>
      <p class="empty-sub">Every disco needs its dancers. Create your first skill.</p>
      <button class="btn btn-primary" data-open-new>+ New Skill</button>
    </div>
  </main>

  <!-- Editor modal -->
  <div id="editor" class="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
      <div class="modal-head">
        <h2 id="editorTitle">New Skill</h2>
        <button class="icon-btn" id="closeEditor" aria-label="Close">&times;</button>
      </div>

      <div class="modal-body">
        <div class="editor-preview">
          <div class="card-portrait-frame" id="portraitFrame">
            <img id="portraitPreview" alt="" hidden />
            <div id="portraitPlaceholder" class="portrait-placeholder">
              <span>150 &times; 200</span>
              <small>drop or choose an image</small>
            </div>
          </div>
          <label class="btn btn-ghost btn-block" for="portraitInput">Choose portrait</label>
          <input type="file" id="portraitInput" accept="image/*" hidden />
          <button type="button" class="btn-link" id="clearPortrait" hidden>Remove portrait</button>
        </div>

        <form class="editor-fields" id="skillForm" autocomplete="off">
          <label class="field">
            <span class="field-label">Skill name</span>
            <input type="text" id="skillName" maxlength="40" placeholder="e.g. Inland Empire" required />
          </label>

          <label class="field">
            <span class="field-label">Attribute</span>
            <select id="skillAttr">
              <option value="intellect">Intellect</option>
              <option value="psyche">Psyche</option>
              <option value="physique">Physique</option>
              <option value="motorics">Motorics</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">Level <em id="levelValue">3</em></span>
            <input type="range" id="skillLevel" min="1" max="12" value="3" />
          </label>

          <label class="field">
            <span class="field-label">Description</span>
            <textarea id="skillDesc" rows="4" maxlength="400" placeholder="What does this voice whisper? Give it a personality."></textarea>
          </label>

          <div class="form-actions">
            <button type="button" class="btn" id="cancelEditor">Cancel</button>
            <button type="submit" class="btn btn-primary" id="saveSkill">Save skill</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
